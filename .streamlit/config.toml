# Light, minimal, premium. Set here rather than in CSS so Streamlit's own
# widgets (inputs, tabs, dataframes, tooltips) inherit the palette instead of
# fighting it -- widget chrome styled only by injected CSS is what makes a
# Streamlit app look half-themed.

[theme]
base = "light"

# Deep ink rather than a saturated blue: at small sizes a mid-blue reads as a
# hyperlink, and this app has a lot of small text.
primaryColor = "#1B3A6B"

backgroundColor = "#FFFFFF"
# A very slight warm grey for the sidebar and cards, so panels separate from
# the canvas without a single visible border.
secondaryBackgroundColor = "#F6F7F9"
textColor = "#14181F"
linkColor = "#1B3A6B"

font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"

baseRadius = "0.55rem"
borderColor = "#E4E7EC"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
runOnSave = false

[browser]
gatherUsageStats = false
